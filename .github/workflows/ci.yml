name: AbhayNayan checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-api:
    name: Python API and safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q backend tests
      - run: python -m pip check
      - run: python -m pytest -q

  web:
    name: Web modules and workflow smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:web
      - run: npm run test:ui
      - run: npm run check:web

  release-artifacts:
    name: Release ZIP contains no research model artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/package_release.py --output dist/abhaynayan-ci-check.zip
      - run: python scripts/check_release_artifacts.py dist/abhaynayan-ci-check.zip
